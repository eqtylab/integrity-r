name: R package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: eqtylab/r-actions/setup-r@v2-branch
        with:
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("reticulate", "roxygen2"))

      - name: Generate documentation, build, and check
        run: ./build-package.sh --no-manual
