name: Release R package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-check-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: eqtylab/r-actions/setup-r@v2-branch
        with:
          use-public-rspm: true

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("reticulate", "roxygen2"))

      - name: Verify release tag
        id: package
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vX.Y.Z format." >&2
            exit 1
          fi

          package_name="$(Rscript --vanilla -e 'cat(read.dcf("package/DESCRIPTION")[1, "Package"])')"
          package_version="$(Rscript --vanilla -e 'cat(read.dcf("package/DESCRIPTION")[1, "Version"])')"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

          echo "tarball=dist/${package_name}_${package_version}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Generate documentation, build, and check
        run: ./build-package.sh --no-manual

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "${{ steps.package.outputs.tarball }}"
          --verify-tag
          --generate-notes
          --title "${GITHUB_REF_NAME}"
