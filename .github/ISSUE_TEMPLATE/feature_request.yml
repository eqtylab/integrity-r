name: Feature request
description: Suggest an improvement for eqty.sdk.r
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve eqty.sdk.r.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve, and who does it affect?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or API you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative designs you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, links, mockups, or other useful context.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and discussions for similar requests.
          required: true
        - label: This request does not contain secrets or sensitive data.
          required: true
